---
name: Nightly Integration Tests

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"  # Daily at 6:00 UTC

jobs:
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: ansible_collections/voipnorm/roomos
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
      - run: pip install ansible-core>=2.15 pytest

      - name: Run integration tests
        run: |
          PYTHONPATH=$(pwd)/../../ python -m pytest \
            tests/integration/ -v -s --tb=short
        working-directory: ansible_collections/voipnorm/roomos
        env:
          WEBEX_TOKEN: ${{ secrets.WEBEX_TOKEN }}
          ROOMOS_DEVICE_ID: ${{ secrets.ROOMOS_DEVICE_ID }}
          ROOMOS_HOST: ${{ secrets.ROOMOS_HOST }}
          ROOMOS_USERNAME: ${{ secrets.ROOMOS_USERNAME }}
          ROOMOS_PASSWORD: ${{ secrets.ROOMOS_PASSWORD }}
