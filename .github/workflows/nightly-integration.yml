---
name: Nightly Integration Tests

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"  # Daily at 6:00 UTC

jobs:
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: ansible_collections/voipnorm/roomos
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: pip install ansible-core>=2.15

      - name: Run integration tests
        run: |
          ansible-test integration --python 3.10 -v \
            roomos_command roomos_config roomos_status
        working-directory: ansible_collections/voipnorm/roomos
        env:
          WEBEX_TOKEN: ${{ secrets.WEBEX_TOKEN }}
          DEVNET_HOST: ${{ secrets.DEVNET_HOST }}
          DEVNET_USER: ${{ secrets.DEVNET_USER }}
          DEVNET_PASS: ${{ secrets.DEVNET_PASS }}
